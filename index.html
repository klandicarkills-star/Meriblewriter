<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Merible Writer</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="header-left"><button id="menuToggle" aria-expanded="false" aria-controls="menuPanel" aria-label="Open menu">☰ Menu ▾</button><strong>✍ Merible Writer</strong></div><span id="status">Ready</span></header>
<main><aside id="menuPanel" hidden><button id="new">＋ New document</button><h3>My documents</h3><div id="library"></div><h3>Combine documents</h3><p class="hint">Select documents in the order you want them combined.</p><div id="mergeList"></div><button id="merge">Combine selected</button></aside>
<section><input id="title" aria-label="Document title" placeholder="Document title"><nav><button data-cmd="bold"><b>B</b></button><button data-cmd="italic"><i>I</i></button><button data-cmd="underline"><u>U</u></button><button data-cmd="insertUnorderedList">• List</button><div class="file-dropdown"><button id="fileToggle" aria-expanded="false" aria-controls="filePanel">File ▾</button><div id="filePanel" hidden><button id="save">Save document</button><button id="docx">Export DOCX</button><button id="pdf">Save as PDF</button><button id="backup">Backup JSON</button><button id="restore">Restore backup</button></div></div><input type="file" id="backupFile" accept="application/json" hidden></nav><div id="editor" contenteditable="true" role="textbox" aria-multiline="true" data-placeholder="Start writing..."></div><footer><span id="words">0 words</span><span>Stored on this device</span></footer></section></main>
<script src="app.js"></script></body></html>
